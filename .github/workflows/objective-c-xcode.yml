name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Set Default Scheme
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            filetype_parameter="workspace"
            extension="xcworkspace"
          else
            filetype_parameter="project"
            extension="xcodeproj"
          fi
          file_to_build=$(ls -A | grep -i "\\.${extension}$" | head -1)
          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          scheme=$(xcodebuild -list -json -"$filetype_parameter" "$file_to_build" | ruby -e "
            require 'json'
            data = JSON.parse(STDIN.gets)
            schemes = (data['project'] || data['workspace'] || {})['schemes'] || []
            abort 'No schemes found in Xcode project/workspace' if schemes.empty?
            puts schemes[0]
          ")
          echo "scheme=$scheme" >> "$GITHUB_ENV"
          echo "filetype_parameter=$filetype_parameter" >> "$GITHUB_ENV"
          echo "file_to_build=$file_to_build" >> "$GITHUB_ENV"
          echo "Using scheme: $scheme with $filetype_parameter: $file_to_build"
      - name: Build
        run: |
          xcodebuild clean build analyze \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            | xcpretty && exit ${PIPESTATUS[0]}
