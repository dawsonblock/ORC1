name: Canonical Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: CLI contract guard
        run: python3 scripts/cli_contract_guard.py

      - name: Canonical verifier
        if: always()
        run: bash scripts/verify-build.sh

      - name: Upload canonical verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-verify-evidence
          path: local/verify/latest/
          if-no-files-found: error
          retention-days: 30
