name: Canonical Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Verify build, tests, and boundary guards
        run: bash scripts/verify-build.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: local/verify/latest/
          if-no-files-found: error
